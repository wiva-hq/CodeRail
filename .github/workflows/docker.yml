# The server image, ghcr.io/wiva-hq/coderail, for linux/amd64 and linux/arm64:
#   a build tag v<version>-build.<N>   :latest, :<version> and :<version>-build.<N>
#   main                               :main
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*-build.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'wiva-hq/CodeRail'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wiva-hq/coderail
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=match,pattern=v(.*)-build\.\d+,group=1
            type=match,pattern=v(.*),group=1
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=CodeRail
            org.opencontainers.image.vendor=Wiva, Inc.
      - uses: docker/build-push-action@v7
        env:
          # (No build record artifact on the run; the image is the output.)
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
